name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  ci:
    uses: preston-bernstein/ci-workflows/.github/workflows/python.yml@980585f4e9c3c1ef982cb934e153f925121fe0c0 # v1
    with:
      python-versions: '["3.11"]'
      install: pip install -e ".[test,dev]"
      lint: ruff check .
      test: pytest -m "not network"

  workflows:
    uses: preston-bernstein/ci-workflows/.github/workflows/actions-lint.yml@980585f4e9c3c1ef982cb934e153f925121fe0c0 # v1
