name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # One job runs every gate once. The same scripts run in .githooks/pre-commit.
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install the pinned gate tools
        run: |
          bash scripts/install-gate-tools.sh "$RUNNER_TEMP/gate-tools"
          echo "$RUNNER_TEMP/gate-tools/bin" >> "$GITHUB_PATH"
      - name: Core gate
        run: bash scripts/core-validate.sh
      - name: GitHub Actions gate
        run: bash scripts/gha-validate.sh
      - name: Python gate
        run: bash scripts/py-validate.sh
      - name: Shell gate
        run: bash scripts/shell-validate.sh
      - name: Writing gate
        env:
          WRITING_BASE_BRANCH: main
        run: bash scripts/writing-validate.sh
