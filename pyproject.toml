[project]
name = "feed-commons"
version = "0.0.0"
description = "Shared RSS/Atom feed polling library for home-lab projects — fetch, parse, normalize, dedupe. Scaffold; each submodule implemented on first real use."
requires-python = ">=3.11"
dependencies = ["requests>=2.31.0,<3", "feedparser>=6.0.11,<7"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-httpserver",
    "ruff==0.16.1",
    "mypy>=1.10",
    "types-requests",
    "vulture>=2.16",
    "mutmut>=3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/feed_commons"]

[tool.pytest.ini_options]
# `mutants/` is mutmut's own generated sandbox (gitignored, never meant to be
# collected) -- without this, a `mutmut run` that mirrors `tests/` into
# `mutants/tests/` causes pytest's own default collection to pick up two
# files with the same module name, breaking collection repo-wide. Matches
# scraper-commons' own established fix for the same issue.
norecursedirs = ["mutants", ".git", ".venv", "dist", "*.egg-info"]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
markers = [
    "network: tests requiring live internet access",
]

[tool.mutmut]
source_paths = ["src/feed_commons"]
also_copy = ["src/feed_commons"]
pytest_add_cli_args_test_selection = ["-m", "not network", "tests/"]

[tool.vulture]
min_confidence = 80

[tool.ruff]
line-length = 100
# Vendored pack gate scripts, copied unchanged. Do not lint or reformat them.
extend-exclude = ["scripts"]

[tool.ruff.lint]
# Pinned on purpose: ruff's default set has changed between releases. The ignore
# list stays empty, so every exception is a `# noqa: CODE -- reason` in the code.
select = [
    "E", "F", "I", "N", "UP",
    "S", "B", "BLE",
    "ASYNC",
    "ANN",
    "T20",
    "G",
    "PGH", "RUF",
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = "feedparser.*"
ignore_missing_imports = true
